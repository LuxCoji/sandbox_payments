name: Regression Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6 AM UTC

jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finsim_regress
          POSTGRES_USER: finsim
          POSTGRES_PASSWORD: finsim_regress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run deterministic regression suite
        run: uv run python scripts/regression_test.py
        env:
          FINSIM_DB_URL: postgresql://finsim:finsim_regress@localhost:5432/finsim_regress
          FINSIM_CHRONO_BACKEND: postgres
