# Provider/account pool for the red-team persona's LLM calls, loaded into a
# litellm.Router model_list at startup (see llm_router.py). All deployments
# share one model_name ("redteam-agent" by default) and act as a rotation
# pool the router fails over across to survive free-tier rate limits — this
# is a single persona spread across providers, not multiple personas.
#
# CAUTION — read before adding entries: Groq and OpenRouter rate-limit at the
# account/org level, not per API key (confirmed from their own docs). Adding
# a second `api_key_env` entry only buys real extra quota if it points to a
# genuinely separate account/org, not a second key on the same one. Using
# multiple accounts to multiply a single free tier's quota sits in a ToS gray
# area for both providers. This is your own sandbox research project and your
# call to make — just don't do it on autopilot.
#
# `rpm` values below are soft/advisory hints for litellm.Router's rate-limit-
# aware routing, not authoritative:
#   - groq: published, org-level (console.groq.com/docs/rate-limits)
#   - openrouter: published, account-level (openrouter.ai/docs/api-reference/limits)
#   - gemini: NOT a stable constant — per-project, read the live value from
#     https://aistudio.google.com/rate-limit and update here periodically
#   - nvidia: unofficial — no published number, ~40 RPM is developer-forum
#     consensus only, treat as unreliable

# Model ids verified live against each provider's own /models endpoint on
# 2026-08-28 (with real keys, for groq/gemini/nvidia — openrouter checked
# unauthenticated against its public model list since no key was configured
# yet). Free-tier models rotate/deprecate often on all four providers —
# re-verify with the same query if a deployment starts 404ing:
#   groq:     curl -H "Authorization: Bearer $GROQ_API_KEY_1" https://api.groq.com/openai/v1/models
#   gemini:   curl "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY_PROJECT_1"
#   nvidia:   curl -H "Authorization: Bearer $NVIDIA_API_KEY_1" https://integrate.api.nvidia.com/v1/models
#   openrouter: curl https://openrouter.ai/api/v1/models   (no auth needed to list)
deployments:
  - provider: groq
    litellm_model: groq/openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY_1
    rpm: 30

  - provider: openrouter
    litellm_model: openrouter/google/gemma-4-31b-it:free
    api_key_env: OPENROUTER_API_KEY_1
    rpm: 20

  - provider: gemini
    litellm_model: gemini/gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY_PROJECT_1
    rpm: 15 # soft — verify against aistudio.google.com/rate-limit for your project

  - provider: nvidia
    # Model *catalog* access varies per NVIDIA account even when the model
    # is listed at GET /v1/models — nvidia/llama-3.1-nemotron-70b-instruct
    # 404'd as "not found for account" despite being listed. Switched from
    # meta/llama-3.2-11b-vision-instruct to the Nemotron reasoning model —
    # not re-verified live against this key yet (see the curl command
    # above), confirm it returns a completion rather than 404ing before
    # relying on it. Nemotron is a reasoning model: its <think>...</think>
    # trace shares the same completion-token budget as the actual
    # {"tool_name": ...} JSON output (see max_tokens below and
    # ProviderDeployment.max_tokens in config.py) — don't cap it back down
    # without checking whether that just truncates the trace before the
    # JSON ever gets emitted.
    litellm_model: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
    api_base: "https://integrate.api.nvidia.com/v1"
    api_key_env: NVIDIA_API_KEY_1
    rpm: 40 # unofficial community estimate, soft cap
    max_tokens: 16384 # generous headroom for reasoning tokens + the JSON output that follows them
