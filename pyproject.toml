[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[project]
name = "finsim"
version = "0.1.0"
description = "Financial Digital Twin + Adversarial Testing Environment"
requires-python = ">= 3.11"
dependencies = [
    "eventsourcing",
    "numpy",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "networkx",
    "torch-geometric",
    "structlog",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "prometheus-client",
    "pymacaroons",
    "pyyaml",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "black",
    "mypy",
    "import-linter",
]
redteam = [
    "litellm>=1.63",
    "langgraph>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["sim", "tests", "agents"]
asyncio_mode = "auto"
# Default is ["test_*.py", "*_test.py"] which silently never collects the
# contract_test_*.py files under sim/*/tests/ (make test-contract's `-k
# contract_test` filter runs AFTER collection, so it was filtering an empty
# set). Add the contract-test naming pattern explicitly.
python_files = ["test_*.py", "*_test.py", "contract_test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "TCH"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.importlinter]
root_package = "sim"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core does not import Population or Chrono implementations"
type = "forbidden"
source_modules = ["sim.core"]
ignore_imports = [
    "sim.core.interfaces -> sim.core.events",
    "sim.core.interfaces -> sim.scheduler.env"
]
forbidden_modules = [
    "sim.population.agents",
    "sim.population.behaviour",
    "sim.population.calibration",
    "sim.population.profiles",
    "sim.population.temporal",
    "sim.chrono.store",
    "sim.chrono.branch",
    "sim.chrono.checkpoint",
    "sim.chrono.replay",
    "sim.chrono.hashing",
]

[[tool.importlinter.contracts]]
name = "Population does not import Core or Chrono implementations"
type = "forbidden"
source_modules = ["sim.population"]
ignore_imports = [
    "sim.core.interfaces -> sim.core.events",
    "sim.core.interfaces -> sim.scheduler.env"
]
forbidden_modules = [
    "sim.core.engine",
    "sim.core.payment",
    "sim.core.account",
    "sim.core.device",
    "sim.core.gateway",
    "sim.core.merchant",
    "sim.core.settlement",
    "sim.core.events",
    "sim.chrono.store",
    "sim.chrono.branch",
    "sim.chrono.checkpoint",
    "sim.chrono.replay",
    "sim.chrono.hashing",
]

[[tool.importlinter.contracts]]
name = "Chrono does not import Core or Population implementations"
type = "forbidden"
source_modules = ["sim.chrono"]
ignore_imports = [
    "sim.core.interfaces -> sim.core.events",
    "sim.core.interfaces -> sim.scheduler.env"
]
forbidden_modules = [
    "sim.core.engine",
    "sim.core.payment",
    "sim.core.account",
    "sim.core.device",
    "sim.core.gateway",
    "sim.core.merchant",
    "sim.core.settlement",
    "sim.core.events",
    "sim.population.agents",
    "sim.population.behaviour",
    "sim.population.calibration",
    "sim.population.profiles",
    "sim.population.temporal",
]

[[tool.importlinter.contracts]]
name = "Gateway does not import Core, Population, or Chrono implementations"
type = "forbidden"
source_modules = ["sim.gateway"]
ignore_imports = [
    "sim.core.interfaces -> sim.core.events",
    "sim.core.interfaces -> sim.scheduler.env"
]
forbidden_modules = [
    "sim.core.engine",
    "sim.core.payment",
    "sim.core.account",
    "sim.core.device",
    "sim.core.gateway",
    "sim.core.merchant",
    "sim.core.settlement",
    "sim.core.events",
    "sim.population.agents",
    "sim.population.behaviour",
    "sim.population.calibration",
    "sim.population.profiles",
    "sim.population.temporal",
    "sim.chrono.store",
    "sim.chrono.branch",
    "sim.chrono.checkpoint",
    "sim.chrono.replay",
    "sim.chrono.hashing",
]

[[tool.importlinter.contracts]]
name = "Sim does not import the red-team harness"
type = "forbidden"
source_modules = ["sim"]
forbidden_modules = ["agents"]

[[tool.importlinter.contracts]]
name = "No direct simpy imports outside scheduler"
type = "forbidden"
source_modules = [
    "sim.core",
    "sim.population",
    "sim.chrono",
    "sim.gateway",
    "sim.observability",
]
ignore_imports = [
    "sim.core.interfaces -> sim.core.events",
    "sim.core.interfaces -> sim.scheduler.env"
]
forbidden_modules = ["simpy"]
